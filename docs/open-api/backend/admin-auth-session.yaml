openapi: 3.0.3
info:
  title: 小鹊云管理后台认证 API
  version: 2.0.0
  description: |
    管理后台登录会话相关接口：登录、退出登录与当前管理员。

    ## 通用约定
    - 所有响应的 HTTP 状态码固定为 `200`，成功与失败由响应体的 `code` 判断：`0` 成功、`40000` 参数错误、`40100` 未登录、`40300` 无权限（含 Origin 校验失败）、`40400` 不存在、`50000` 服务端错误。
    - 登录状态使用 **Session**：服务端基于 `github.com/hertz-contrib/sessions` + Redis，会话 ID 通过 HttpOnly Cookie `xqyun_admin_session` 在浏览器与服务端之间传递，响应体不返回任何令牌，前端 JS 无法读取。
    - Cookie 属性由服务端配置：默认 `Path=/api/v1/admin`、`SameSite=Lax`、`HttpOnly`、TTL 12 小时；生产环境 HTTPS 下 `Secure=true`，本地 HTTP 开发为 `false`。
    - 除登录外的后台接口都需要携带有效会话 Cookie；非 GET / HEAD / OPTIONS 请求会校验 `Origin` 与 `Host` 一致。
servers:
  - url: http://127.0.0.1:8888
    description: 本地开发
tags:
  - name: 管理后台-认证
    description: 管理后台登录、退出与当前管理员

paths:
  /api/v1/admin/auth/login:
    post:
      tags:
        - 管理后台-认证
      summary: 账号密码登录
      operationId: loginAdmin
      description: |
        校验用户名、密码与账号状态。成功后把管理员 ID / 用户名写入 Redis 会话，
        并通过 `Set-Cookie` 下发 `xqyun_admin_session`。

        ## 业务错误
        | code | 场景 |
        | --- | --- |
        | `0` | 登录成功 |
        | `40000` | 用户名或密码为空 |
        | `40100` | 用户名或密码错误 |
        | `40300` | 账号已被禁用 |
        | `50000` | 服务端临时故障 |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 业务响应。HTTP 状态固定为 200，按响应体 `code` 判断结果。
          headers:
            Set-Cookie:
              description: 登录成功时写入 HttpOnly 会话 Cookie。
              schema:
                type: string
              example: xqyun_admin_session=...; Path=/api/v1/admin; Max-Age=43200; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  summary: 登录成功
                  value:
                    code: 0
                    message: ok
                    data:
                      expires_in: 43200
                      user:
                        id: '1'
                        username: admin
                        name: 小阙
                        email: ''
                        mobile: ''
                        avatar: ''
                        roles: []
                        permissions: []
                invalidCredentials:
                  summary: 用户名或密码错误
                  value:
                    code: 40100
                    message: 用户名或密码错误
                accountDisabled:
                  summary: 账号已被禁用
                  value:
                    code: 40300
                    message: 账号已被禁用

  /api/v1/admin/auth/logout:
    post:
      tags:
        - 管理后台-认证
      summary: 退出登录
      operationId: logoutAdmin
      description: |
        删除当前会话（Redis 记录）并清除会话 Cookie。

        该接口是幂等的：没有会话 Cookie 或会话已过期时同样返回 `code: 0`。
      security:
        - adminSessionCookie: []
      responses:
        '200':
          description: 业务响应。HTTP 状态固定为 200，按响应体 `code` 判断结果。
          headers:
            Set-Cookie:
              description: 退出成功时写入过期 Cookie（`Max-Age=0`）清除 `xqyun_admin_session`。
              schema:
                type: string
              example: xqyun_admin_session=; Path=/api/v1/admin; Max-Age=0; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
              examples:
                success:
                  summary: 退出成功（未携带 Cookie 时同样返回）
                  value:
                    code: 0
                    message: ok
                serverError:
                  summary: 服务端临时故障
                  value:
                    code: 50000
                    message: 退出登录失败，请稍后重试

  /api/v1/admin/me:
    get:
      tags:
        - 管理后台-认证
      summary: 当前登录管理员
      operationId: getAdminMe
      description: 从登录会话读取当前管理员 ID，并返回账号资料。
      security:
        - adminSessionCookie: []
      responses:
        '200':
          description: 业务响应。HTTP 状态固定为 200，按响应体 `code` 判断结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              examples:
                success:
                  summary: 已登录
                  value:
                    code: 0
                    message: ok
                    data:
                      id: '1'
                      username: admin
                      name: 小阙
                      email: ''
                      mobile: ''
                      avatar: ''
                unauthorized:
                  summary: 未登录或会话已失效
                  value:
                    code: 40100
                    message: 请先登录

components:
  securitySchemes:
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: xqyun_admin_session
      description: |
        登录成功时由服务端写入的 HttpOnly 会话 Cookie。
        浏览器会自动携带，前端脚本无法读取；使用 Swagger UI 等工具调试时可手工添加该字段。

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: '123456'

    LoginResponse:
      type: object
      description: 登录响应。`code = 0` 时 `data` 必填，其余情况只有 `code` 与 `message`。
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 业务码，`0` 表示成功
          enum:
            - 0
            - 40000
            - 40100
            - 40300
            - 50000
          example: 0
        message:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/AdminSession'

    AdminSession:
      type: object
      description: 登录成功后的会话有效期与账号信息。
      required:
        - expires_in
        - user
      properties:
        expires_in:
          type: integer
          description: 会话有效期（秒）
          example: 43200
        user:
          $ref: '#/components/schemas/AdminUser'

    AdminUser:
      type: object
      description: 管理后台账号信息。
      required:
        - id
        - username
        - name
        - email
        - mobile
        - avatar
        - roles
        - permissions
      properties:
        id:
          type: string
          description: 用户 ID，JSON 中统一使用字符串
          example: '1'
        username:
          type: string
          example: admin
        name:
          type: string
          example: 小阙
        email:
          type: string
          description: 未设置时为空字符串
          example: ''
        mobile:
          type: string
          description: 未设置时为空字符串
          example: ''
        avatar:
          type: string
          description: 头像地址或 data URL，未设置时为空字符串
          example: ''
        roles:
          type: array
          description: 角色列表，当前版本为空数组
          items:
            type: string
          example: []
        permissions:
          type: array
          description: 权限列表，当前版本为空数组
          items:
            type: string
          example: []

    MeResponse:
      type: object
      description: 当前管理员资料响应。
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 业务码，`0` 表示成功
          enum:
            - 0
            - 40100
            - 40400
            - 50000
          example: 0
        message:
          type: string
          example: ok
        data:
          type: object
          required:
            - id
            - username
            - name
            - email
            - mobile
            - avatar
          properties:
            id:
              type: string
              example: '1'
            username:
              type: string
              example: admin
            name:
              type: string
              example: 小阙
            email:
              type: string
              example: ''
            mobile:
              type: string
              example: ''
            avatar:
              type: string
              example: ''

    SimpleResponse:
      type: object
      description: 无数据响应，成功时不返回 `data`。
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 业务码，`0` 表示成功
          enum:
            - 0
            - 40100
            - 40300
            - 50000
          example: 0
        message:
          type: string
          example: ok
