# 非敏感配置：可以提交到仓库。
# 数据库用户名 / 密码、Redis 密码与 JWT 密钥统一放在 service/.env（参考 .env.example）。

app:
  env: dev

server:
  addr: ":8888"

mysql:
  host: "127.0.0.1"
  port: 3306
  database: "xqyun"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: "1h"
  log_level: 2 # 1: silent, 2: error, 3: warn, 4: info

redis:
  # 管理后台登录会话存储在 Redis 中，必须启用；关闭后服务启动会失败。
  enabled: true
  host: "127.0.0.1"
  port: 6379
  db: 0
  pool_size: 10

jwt:
  # 管理后台已改用 Session；这里保留给后续前台用户登录使用。
  issuer: "xiaoque-auth"
  cookie:
    name: "xqyun_frontend_refresh"
    path: "/api/v1/frontend"
    domain: ""
    # 生产环境必须为 true（HTTPS）；本地 HTTP 开发使用 false
    secure: false
    same_site: "Lax"
  clients:
    frontend:
      audience: "frontend-api"
      token_type: "frontend"
      access_ttl: "30m"
      refresh_ttl: "720h"

session:
  # 管理后台登录会话（hertz-contrib/sessions + Redis）。
  name: "xqyun_admin_session"
  path: "/api/v1/admin"
  domain: ""
  # 生产环境必须为 true（HTTPS）；本地 HTTP 开发使用 false
  secure: false
  same_site: "Lax"
  ttl: "12h"

render_cache:
  # 前台渲染数据（页面 / 导航 / 站点配置）的 Redis 缓存。
  # 发布、下架、删除页面以及保存导航 / 站点配置时会主动删除对应缓存；
  # ttl 只是失效逻辑漏删时的兜底。
  enabled: true
  ttl: "10m"

upload:
  # 素材存储实现：当前支持 local（本地磁盘）。
  # 后续可扩展 oss / cos / s3，在 repository/media.NewStorage 注册。
  provider: "local"
  # 视频素材保存到本地目录；静态访问路径为 /uploads。
  # 生产环境建议把目录挂到持久盘，或替换为对象存储。
  dir: "uploads"
  url_prefix: "/uploads"
  # 拼接素材完整 URL 的站点地址；生产环境填官网域名 / CDN。
  public_base_url: "http://127.0.0.1:8888"
  max_video_mb: 200
  max_image_mb: 10

log:
  level: "info"
  # 开发环境（APP_ENV != production）输出到控制台；生产环境写入 logs/app.log。
  dir: "logs"
  filename: "app.log"
  max_size_mb: 100
  max_backups: 30
  max_age_days: 30
  compress: true
  # 仅开发环境终端生效；生产文件日志不带颜色
  color: true
