name: xiaoque

# 方式三：不构建任何镜像，直接用官方镜像挂载 data/release 下的构建产物。
# 需要提前准备好：
#   data/release/admin/                  管理后台静态文件
#   data/release/frontend/.output/       官网 Nuxt SSR 产物
#   data/release/backend/xqyun           Linux 可执行文件（chmod +x）
#   data/release/backend/config.yaml
#   data/nginx/conf/default.conf
#   ./init.sql、./migration/
#
# 启动：docker compose -f docker-compose.artifacts.yml up -d

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: xqyun
      MYSQL_USER: xqyun
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 只绑定宿主机回环地址，供 SSH 隧道 / 本机客户端访问；不要改成 0.0.0.0 或 "3306:3306"。
      # 宿主机 3306 已被占用时，在 .env 里设 MYSQL_HOST_PORT=3307。
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.18.3
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_USERNAME: xqyun
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./migration:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec migrate -path=/migrations \
          -database "mysql://$${MYSQL_USERNAME}:$${MYSQL_PASSWORD}@tcp(mysql:3306)/xqyun" up

  backend:
    image: alpine:3.22
    restart: unless-stopped
    working_dir: /app
    command: ["/app/xqyun"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      SERVER_ADDR: ":8888"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: xqyun
      MYSQL_USERNAME: xqyun
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      UPLOAD_PROVIDER: local
      UPLOAD_DIR: /app/uploads
      UPLOAD_URL_PREFIX: /uploads
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL}
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/release/backend/xqyun:/app/xqyun:ro
      - ./data/release/backend/config.yaml:/app/config.yaml:ro
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
      # Alpine 镜像不带时区数据库，挂载宿主机的 zoneinfo 让 TZ=Asia/Shanghai 生效。
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    ports:
      # 只绑定回环：Nginx 与前端都走 Compose 内网，宿主机端口仅用于调试。
      # 不要改回 "8888:8888"，否则后端接口与 /metrics 指标都会暴露到公网。
      - "127.0.0.1:${BACKEND_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8888/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "/app/.output/server/index.mjs"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # SSR 与浏览器侧 /api/backend/** 代理共用，运行期生效，不需要重新构建。
      NUXT_API_BASE: http://backend:8888/api/v1
      NUXT_PUBLIC_API_BASE: /api/backend
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/release/frontend/.output:/app/.output:ro
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/release/admin:/usr/share/nginx/html/admin:ro
      - ./data/nginx/conf:/etc/nginx/conf.d:ro
    ports:
      - "${HTTP_PORT:-80}:80"

  # ===== 监控（可选，profile: jk）=====
  # 默认 `docker compose up -d` 不启动这两个服务。
  # 启动监控：docker compose --profile jk up -d
  # 只停监控：docker compose stop prometheus grafana
  #
  # 首次启动前：
  #   mkdir -p data/monitoring/prometheus data/monitoring/grafana
  #   chown -R 65534:65534 data/monitoring/prometheus
  #   chown -R 472:472     data/monitoring/grafana
  #   在 .env 设置 GRAFANA_PASSWORD
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["jk"]
    restart: unless-stopped
    volumes:
      # 配置在仓库内的 monitoring/，运行时数据在 data/monitoring/
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/monitoring/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      # 只绑定回环，供 SSH 隧道调试；Grafana 走 Compose 内网访问
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.4.0
    profiles: ["jk"]
    restart: unless-stopped
    environment:
      # 必须先在 .env 设置，否则会落到 Grafana 默认弱口令。
      # 这里不用 ${GRAFANA_PASSWORD:?...}：Compose 会对所有服务做变量插值，
      # 即使没启用 profile，缺失变量也会让普通的 `docker compose up -d` 失败。
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 不要设置 GF_SERVER_HTTP_ADDR=127.0.0.1：
      # 容器内绑回环后，Docker 端口映射（DNAT 到容器 eth0）访问不到。
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/monitoring/grafana:/var/lib/grafana
    ports:
      # 只绑定回环，公网 / 内网均不可直接访问，需 SSH 隧道：
      #   ssh -L 3001:127.0.0.1:3001 root@<服务器>
      - "127.0.0.1:3001:3000"
